services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Sitegeist\Translatelabels\:
    resource: '../Classes/*'
    exclude: '../Classes/{Domain/Model,Plugin,ViewHelpers/FluidComponents/Form}'
  Sitegeist\Translatelabels\EventListener\TypoScriptFrontendEventListener:
    tags:
      - name: event.listener
        identifier: sitegeist/translatelabels/typo-script-frontend-event-listener
        event: TYPO3\CMS\Frontend\Event\AfterCacheableContentIsGeneratedEvent
